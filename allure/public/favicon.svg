<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo Preto Luxo Arredondado -->
  <rect width="64" height="64" rx="16" fill="#090D16"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B76"/>
      <stop offset="35%" stop-color="#E8C5A5"/>
      <stop offset="70%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#FAECD9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Símbolo Z Estilizado em Rose Gold / Dourado Metálico -->
  <g transform="translate(13, 11) scale(0.6)">
    <path d="M 8 16 C 8 8, 22 8, 40 8 L 40 16 C 26 16, 17 20, 13 34 C 18 30, 27 28, 38 34 L 44 24 L 56 38 L 40 44 L 44 38 C 32 32, 21 34, 15 42 C 9 49, 15 58, 40 58 C 48 58, 54 53, 56 48 L 56 56 C 52 61, 44 64, 36 64 C 7 64, 2 50, 8 36 L 8 16 Z" 
          fill="url(#goldGradient)" filter="url(#glow)"/>
  </g>
</svg>
